function art(p,extra=''){return `<div class="collection-art ${extra}" style="background-image:url('${esc(images[p.image]||images.forest)}')"><span class="cover-caption">${esc(p.en||'YOUR OWN COLLECTION')}</span><span class="cover-count">${icon('play')}${(p.songIds||[]).length} 首</span><span class="cover-text">${esc(p.lines||p.name).replace(/\n/g,'<br>')}</span><span class="card-play">${icon('play')}</span></div>`;}
function collectionCard(p){return `<a class="collection-card" href="#/playlist/${esc(p.id)}">${art(p)}<h3>${esc(p.name)}</h3><p>${esc(p.caption||'我的歌单')} · ${(p.songIds||[]).length} 首</p></a>`;}
function rows(songs,removable=false){return songs.map((s,i)=>`<div class="track-row ${current?.id===s.id?'current':''}" data-song-row="${esc(s.id)}"><button class="track-index" data-action="play" data-id="${esc(s.id)}" aria-label="播放 ${esc(s.title)}"><span class="index-number">${String(i+1).padStart(2,'0')}</span><span class="row-play">${icon('play')}</span></button>${cover(s)}<button class="track-name" data-action="play" data-id="${esc(s.id)}"><strong>${esc(s.title)}</strong><small>${esc(s.artist)}${s.source==='soundhelix'?' · 测试音频':s.url?' · 自定义音源':' · 歌曲海目录'}</small></button><span class="track-album">${esc(s.album||'我的音乐')}</span><button class="icon-button ${state.liked.includes(s.id)?'liked':''}" data-action="like" data-id="${esc(s.id)}" aria-label="${state.liked.includes(s.id)?'取消喜欢':'喜欢'} ${esc(s.title)}">${icon('heart')}</button><button class="icon-button add-track" data-action="${removable?'remove-from-list':'add'}" data-id="${esc(s.id)}" aria-label="${removable?'从歌单移除':'添加到歌单'} ${esc(s.title)}">${icon(removable?'close':'plus')}</button></div>`).join('');}
function table(songs,removable=false){visibleSongs=songs;return `<div class="track-list full"><div class="table-heading"><span>#</span><span></span><span>歌曲</span><span>来源 / 专辑</span><span></span><span></span></div>${rows(songs,removable)}</div>`;}
function empty(title,desc,button='发现好音乐',action='discover'){return `<div class="empty-state"><div class="empty-icon">${icon('headphones')}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p><button class="primary-button" data-action="${action}">${esc(button)}</button></div>`;}
function pageHeading(title,sub,kicker='YOUR PERSONAL MUSIC SPACE'){return `<div class="page-heading"><div><div class="page-kicker">${kicker}</div><h1>${title}</h1>${sub?`<p class="heading-sub">${sub}</p>`:''}</div></div>`;}
function renderSidebar(){ $('#liked-count').textContent=state.liked.length; $('#sidebar-playlists').innerHTML=state.playlists.length?state.playlists.map(p=>`<a href="#/playlist/${esc(p.id)}">${icon('music')}<span>${esc(p.name)}</span></a>`).join(''):'<a href="#/library" class="empty-playlists">'+icon('plus')+'创建你的第一张歌单</a>';const path=location.hash.split('/')[1]||'discover';document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===path));}
function renderDiscover(){const chosen=activeFilter==='全部'?collections:collections.filter(c=>c.tag===activeFilter);visibleSongs=demos;return `<div class="page-heading"><div><div class="page-kicker">A LITTLE MUSIC. A LITTLE YOU.</div><h1>发现音乐</h1><p class="heading-sub">在这里，遇见刚刚好的旋律。</p></div><span class="date-label">${icon('calendar')}${new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date())}</span></div><div class="hero-grid"><section class="hero"><span class="eyebrow">MUSIC IS A PLACE TO GO</span><h2>给耳朵一点自由，<br>给生活一点留白。</h2><p>戴上耳机，让世界慢下来。</p><button class="white-button" data-action="play-demos">${icon('play')}听听此刻的心情</button><span class="hero-number">VOL. 001 / 慢下来</span></section><section class="daily"><span class="eyebrow">YOUR DAILY ESCAPE</span><h2>今天，<br>听点不一样。</h2><p>不赶路的日子<br>让音乐带你去远方</p><button class="round-button" data-action="random" aria-label="随机播放一首测试音乐">${icon('play')}</button><span class="daily-tag">JUST PRESS PLAY</span></section></div><section><div class="section-title"><h2>为心情，选张歌单</h2><div class="filters">${['全部','华语','放松','夜晚'].map(t=>`<button class="filter ${activeFilter===t?'active':''}" data-action="filter" data-filter="${t}">${t}</button>`).join('')}</div></div><div class="collection-grid">${chosen.map(collectionCard).join('')}</div></section><div class="bottom-grid"><section><div class="section-title"><h2>先听一首</h2><span class="sub">基础播放测试 <span class="poc-label">POC</span></span><a href="#/search" class="text-link">全部歌曲${icon('chevron-right')}</a></div><div class="track-list">${rows(demos)}</div></section><aside class="note-card"><div class="note-icon">${icon('leaf')}</div><h3>你的小岛，你来定义。</h3><p>把喜欢的歌放在一起。<br>不用注册，歌单和收藏<br>都会留在这台设备上。</p><button class="text-link" data-action="create">创建我的第一张歌单 ${icon('chevron-right')}</button></aside></div>`;}
function renderLibrary(){return pageHeading('我的歌单',`${state.playlists.length} 张歌单，每一张都是你的声音。`)+`<div class="toolbar"><button class="primary-button" data-action="create">${icon('plus')}新建歌单</button><button class="secondary-button" data-action="export">${icon('download')}导出备份</button><button class="secondary-button" data-action="import">${icon('upload')}导入备份</button></div><div class="collection-grid library-grid">${state.playlists.map(collectionCard).join('')}<button class="collection-card new-card" data-action="create"><div class="collection-art">${icon('plus')}</div><h3>一张新的歌单</h3><p>从喜欢的第一首歌开始</p></button></div>`;}
function renderPlaylist(id){const p=listBy(id);if(!p)return empty('这张歌单不见了','可以回到音乐库，重新选一张。','返回我的歌单','library');const songs=listSongs(p),own=state.playlists.includes(p);return `<div class="collection-head">${art(p,'large-art')}<div class="collection-description"><div class="page-kicker">${own?'MY OWN COLLECTION':'TINGYU SELECTION'}</div><h1>${esc(p.name)}</h1><p>${esc(p.description||'把喜欢的旋律，收进自己的小岛。')}</p><p>${songs.length} 首音乐 · ${own?'保存在此设备':'听屿精选'}</p><div class="toolbar"><button class="primary-button" data-action="play-all">${icon('play','play-icon')}播放全部</button>${own?`<button class="secondary-button" data-action="edit-list" data-id="${esc(id)}">${icon('edit')}编辑</button>`:`<button class="secondary-button" data-action="save-collection" data-id="${esc(id)}">${icon('plus')}收藏歌单</button>`}</div></div></div>${p.songIds?.some(id=>!songBy(id)?.url)?'<div class="inline-note">这是歌曲海原曲目录。纯静态 POC 不实时解析歌曲海音源；点击歌曲可以前往来源，或为测试添加你自己的直链。</div>':''}${songs.length?table(songs,own):empty('歌单的第一首，等你来选','在歌曲右侧点击 +，就能把它添加到这里。')}`;}
function renderSearch(){const q=decodeURIComponent(location.hash.split('/').slice(2).join('/')||'');$('#global-search').value=q;const songs=allSongs().filter(s=>(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(q.toLowerCase()));return pageHeading(q?`搜索「${esc(q)}」`:'找一首，想听的歌',q?`${songs.length} 首匹配结果 · 当前 POC 曲库`:'静态 POC 可搜索测试音频、歌曲海目录和你添加的直链。')+`<div class="search-tools">${['周杰伦','SoundHelix','晴天','青花瓷'].map(s=>`<button data-action="quick-search" data-query="${esc(s)}">${esc(s)}</button>`).join('')}<button data-action="add-url">+ 添加音频直链</button></div>${songs.length?table(songs):empty('没有找到这首歌','换个关键词，或添加你自己的音频直链。','添加直链','add-url')}`;}
function render(){const [route,id]=location.hash.replace(/^#\//,'').split('/');const titles={discover:'发现音乐',charts:'精选目录',library:'我的歌单',liked:'我喜欢的音乐',recent:'最近播放',search:'搜索音乐',playlist:'歌单'};$('#header-location').textContent=titles[route]||'发现音乐';renderSidebar();let html;switch(route){case'library':html=renderLibrary();break;case'playlist':html=renderPlaylist(id);break;case'liked':{const songs=state.liked.map(songBy).filter(Boolean);html=pageHeading('我喜欢的音乐',`${songs.length} 首心动，值得单曲循环。`)+(songs.length?`<div class="toolbar"><button class="primary-button" data-action="play-all">${icon('play')}播放全部</button></div>`+table(songs):empty('喜欢，会在这里留下痕迹','点亮歌曲旁的爱心，把心动的旋律留下来。'));break;}case'recent':{const songs=state.recent.map(songBy).filter(Boolean);html=pageHeading('最近播放','那些刚刚陪伴过你的旋律。')+(songs.length?table(songs):empty('还没有播放记录','从一首测试音乐开始，看看新的播放器。'));break;}case'search':html=renderSearch();break;case'charts':html=pageHeading('歌曲海精选目录','周杰伦 · 15 首原曲目录；POC 暂未接入实时排行榜。')+'<div class="inline-note">此处为已核实的歌曲海曲目目录，未标注虚构排名。点击歌曲可打开来源网站；需要测试内嵌播放，请先听首页的测试音频。</div>'+table(gequhai);break;default:html=renderDiscover();}$('#main').innerHTML=html;$('#sidebar').classList.remove('open');updatePlayer();}
function updatePlayer(){const playing=!audio.paused&&!audio.ended;$('#play-toggle').innerHTML=icon(playing?'pause':'play');$('#play-toggle').setAttribute('aria-label',playing?'暂停':'播放');$('#play-toggle').classList.toggle('is-playing',playing);$('#play-toggle').classList.toggle('loading',loading);$('#queue-count').textContent=queue.length;$('#player-like').classList.toggle('liked',!!current&&state.liked.includes(current.id));$('#player-like').setAttribute('aria-label',current&&state.liked.includes(current.id)?'取消喜欢当前歌曲':'喜欢当前歌曲');$('#mode-button').innerHTML=state.mode==='shuffle'?icon('shuffle'):icon('repeat');$('#mode-button').classList.toggle('active-mode',state.mode!=='list');$('#mode-button').title={list:'顺序播放',repeat:'单曲循环',shuffle:'随机播放'}[state.mode];$('#mode-button').setAttribute('aria-label','播放模式：'+$('#mode-button').title);if(current){$('#now-title').textContent=current.title;$('#now-artist').textContent=current.artist+(current.source==='soundhelix'?' · 测试音频':'');$('#now-cover').innerHTML=imageFor(current)?`<img src="${esc(imageFor(current))}" alt="">`:icon('music');$('.source-chip').textContent=current.source==='soundhelix'?'测试音频':'自定义音源';}document.querySelectorAll('[data-song-row]').forEach(el=>el.classList.toggle('current',el.dataset.songRow===current?.id));}
async function playSong(s,context){if(!s)return;if(!s.url){showSource(s);return;}if(context){queue=context.filter(t=>t.url).map(t=>t.id);state.queue=queue;save();}else if(!queue.includes(s.id)){queue.push(s.id);state.queue=queue;save();}const token=++loadToken;current=s;loading=true;audio.pause();audio.src=s.url;$('#elapsed').textContent='00:00';$('#duration').textContent='00:00';$('#progress').value=0;$('#progress').style.setProperty('--fill','0%');updatePlayer();try{await audio.play();if(token!==loadToken)return;state.recent=[s.id,...state.recent.filter(id=>id!==s.id)].slice(0,80);save();loading=false;updatePlayer();if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album||'听屿'});}}catch(e){if(token!==loadToken)return;loading=false;updatePlayer();toast(e.name==='NotAllowedError'?'请再点一次播放按钮，浏览器需要你的点击。':'音源暂时无法播放，可尝试下一首或添加自己的直链。');}}
function next(direction=1,ended=false){if(!queue.length){playSong(demos[0],demos);return;}let i=queue.indexOf(current?.id);if(state.mode==='shuffle'&&queue.length>1){let n;do{n=Math.floor(Math.random()*queue.length);}while(n===i);i=n;}else if(ended&&state.mode==='repeat'){audio.currentTime=0;audio.play().catch(()=>toast('请点击播放继续。'));return;}else{const n=i+direction;if(ended&&n>=queue.length){loading=false;updatePlayer();return;}i=(n+queue.length)%queue.length;}playSong(songBy(queue[i]));}
function toggleLike(id){if(!songBy(id))return;const i=state.liked.indexOf(id);if(i<0)state.liked.push(id);else state.liked.splice(i,1);save();render();if(drawerMode==='queue')showQueue();toast(i<0?'已加入我喜欢的音乐':'已取消喜欢');}
function modal(title,body){$('#modal-content').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-button" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal();}
function createList(editId=null,addId=null){const p=editId?state.playlists.find(p=>p.id===editId):null;modal(p?'编辑歌单':'创建一张新歌单',`<p class="modal-sub">给喜欢的音乐一个家。歌单保存在当前浏览器，无需登录。</p><form id="playlist-form"><label class="field"><span>歌单名称</span><input name="name" aria-label="歌单名称" placeholder="例如：下班后的自由时间" required maxlength="40" value="${esc(p?.name||'')}"></label><label class="field"><span>想对这张歌单说的话</span><textarea name="description" aria-label="歌单描述" placeholder="写下属于这张歌单的心情……" maxlength="200" rows="3">${esc(p?.description||'')}</textarea></label><div class="modal-actions">${p?`<button type="button" class="secondary-button danger" data-action="delete-list" data-id="${esc(p.id)}">删除歌单</button>`:''}<button type="button" class="secondary-button" data-action="close-modal">取消</button><button type="submit" class="primary-button">${p?'保存修改':'创建歌单'}</button></div></form>`);$('#playlist-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name)return;const id=p?.id||'local-'+crypto.randomUUID();if(p){p.name=name;p.description=f.get('description').trim();}else state.playlists.unshift({id,name,description:f.get('description').trim(),songIds:addId?[addId]:[],image:['forest','coast','city','sunset'][state.playlists.length%4],caption:'我的歌单',createdAt:new Date().toISOString()});save();$('#modal').close();location.hash='/playlist/'+id;render();toast(p?'歌单已更新':'歌单创建成功');};}
function addToPlaylist(id){menuSong=id;modal('添加到歌单',`<p class="modal-sub">${esc(songBy(id)?.title)}</p><div class="modal-list"><button data-action="create-and-add" data-id="${esc(id)}">${icon('plus')}创建新歌单</button>${state.playlists.map(p=>`<button data-action="choose-list" data-id="${esc(id)}" data-list="${esc(p.id)}">${icon('music')}<span>${esc(p.name)}<small>${p.songIds.length} 首音乐</small></span></button>`).join('')}</div>`);}
function showSource(s){modal('歌曲海 · 原曲入口',`<p class="modal-sub">${esc(s.title)} — ${esc(s.artist)}<br><br>这首歌已收录在歌曲海目录中。静态 POC 还未接入它的动态播放接口；你可以前往来源网站收听，或添加你自己的音频直链测试播放器。</p><div class="modal-actions"><button class="secondary-button" data-action="add-url" data-id="${esc(s.id)}">添加音频直链</button><a class="primary-button" href="${esc(s.sourceUrl)}" target="_blank" rel="noopener noreferrer">前往歌曲海 ${icon('external')}</a></div>`);}
function addUrl(id){const s=songBy(id);modal('添加音频直链',`<p class="modal-sub">支持可公开访问的 HTTPS MP3 / M4A / OGG 等音频。链接仅保存在当前设备；播放时直接连接音源。</p><form id="url-form"><label class="field"><span>歌曲名称</span><input name="title" aria-label="歌曲名称" required maxlength="100" value="${esc(s?.title||'')}"></label><label class="field"><span>歌手</span><input name="artist" aria-label="歌手" maxlength="80" value="${esc(s?.artist||'')}"></label><label class="field"><span>音频 HTTPS 链接</span><input name="url" aria-label="音频 HTTPS 链接" type="url" required placeholder="https://example.com/music.mp3"></label><div class="modal-actions"><button type="button" class="secondary-button" data-action="close-modal">取消</button><button class="primary-button" type="submit">添加并播放</button></div></form>`);$('#url-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=f.get('url').trim();if(!validURL(url)){toast('请使用有效的 HTTPS 音频链接。');return;}const track={id:'custom-'+crypto.randomUUID(),title:f.get('title').trim(),artist:f.get('artist').trim()||'自定义音源',source:'custom',url,image:'coast',album:'自定义音源'};state.custom.push(track);save();$('#modal').close();playSong(track);render();};}
const validURL=url=>{try{return new URL(url).protocol==='https:';}catch{return false;}};
function openDrawer(mode,body){drawerMode=mode;$('#drawer').innerHTML=body;$('#drawer').hidden=false;$('#drawer-scrim').hidden=false;}
function closeDrawer(){drawerMode='';$('#drawer').hidden=true;$('#drawer-scrim').hidden=true;}
function showQueue(){openDrawer('queue',`<div class="drawer-header"><h2>播放队列 <small>${queue.length} 首</small></h2><button class="icon-button" data-action="close-drawer" aria-label="关闭播放队列">${icon('close')}</button></div><p class="modal-sub">仅包含可在此播放器播放的音频。</p>${queue.length?rows(queue.map(songBy).filter(Boolean)):empty('队列还是空的','选一首测试音乐，开始播放。','播放测试音乐','play-demos')}`);}
function showLyrics(){if(!current){toast('先选一首歌，再来看看。');return;}openDrawer('lyrics',`<div class="drawer-header"><h2>正在播放</h2><button class="icon-button" data-action="close-drawer" aria-label="关闭正在播放">${icon('close')}</button></div>${art({name:current.title,lines:current.title,en:'NOW PLAYING',image:current.image,songIds:[]},'')}<h2 style="margin-top:24px;font-size:20px">${esc(current.title)}</h2><p class="heading-sub">${esc(current.artist)}</p><div class="lyric-body">${current.lyrics?esc(current.lyrics):'让音乐自己说话。'}</div><p class="lyric-note">${current.source==='soundhelix'?'当前为 SoundHelix 测试音频，无同步歌词。':'当前曲目没有提供同步歌词。'}</p>`);}
function settings(){modal('音乐留在这里',`<p class="modal-sub">收藏、歌单和播放记录保存在这台设备的浏览器里。无需注册，也不会自动同步到其他设备。清除浏览器数据会移除本地收藏，建议先导出备份。</p><div class="settings-actions"><button class="secondary-button" data-action="export">${icon('download')}导出歌单与收藏</button><button class="secondary-button" data-action="import">${icon('upload')}导入备份文件</button><button class="secondary-button" data-action="add-url">${icon('plus')}添加音频直链</button></div><p class="lyric-note">POC 版本 · 基础播放 / 本地歌单<br>首页为 SoundHelix 测试音频；歌曲海目录保留原曲来源入口，未接入实时搜索和音源解析。</p>`);}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tingyu-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出');}
function importData(value){if(!value||value.version!==1||!['playlists','liked','custom'].every(k=>Array.isArray(value[k])))throw new Error('invalid');if(value.custom.length>500||value.playlists.length>200)throw new Error('too large');const custom=value.custom.map(t=>{if(!t||typeof t.id!=='string'||!t.id.startsWith('custom-')||typeof t.title!=='string'||!validURL(t.url))throw new Error('invalid track');return {id:t.id.slice(0,100),title:t.title.slice(0,100),artist:String(t.artist||'自定义音源').slice(0,80),url:t.url,source:'custom',album:'自定义音源',image:'coast'};});const ids=new Set([...demos,...gequhai,...state.custom,...custom].map(t=>t.id));const playlists=value.playlists.map(p=>{if(!p||typeof p.name!=='string'||!Array.isArray(p.songIds))throw new Error('invalid list');return {id:'local-'+crypto.randomUUID(),name:p.name.slice(0,40),description:String(p.description||'').slice(0,200),songIds:[...new Set(p.songIds.filter(id=>ids.has(id)))].slice(0,1000),image:Object.hasOwn(images,p.image)?p.image:'forest',caption:'导入的歌单'};});for(const t of custom)if(!state.custom.some(s=>s.id===t.id))state.custom.push(t);state.playlists.push(...playlists);state.liked=[...new Set([...state.liked,...value.liked.filter(id=>ids.has(id))])];save();render();toast(`已导入 ${playlists.length} 张歌单，原有歌单已保留`);}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const {action,id,list}=t.dataset;switch(action){case'play':playSong(songBy(id),t.closest('#drawer')?queue.map(songBy).filter(Boolean):visibleSongs);break;case'play-all':{const available=visibleSongs.filter(s=>s.url);available.length?playSong(available[0],available):toast('这张歌单是原曲目录，请前往歌曲海收听或添加音频直链。');break;}case'play-demos':playSong(demos[0],demos);break;case'random':playSong(demos[Math.floor(Math.random()*demos.length)],demos);break;case'toggle':if(!current)playSong(demos[0],demos);else if(audio.paused)audio.play().catch(()=>toast('音源暂时无法播放，请重试或切换下一首。'));else audio.pause();break;case'previous':next(-1);break;case'next':next();break;case'like':toggleLike(id);break;case'like-current':current?toggleLike(current.id):toast('先播放一首音乐吧');break;case'create':createList();break;case'create-and-add':createList(null,id);break;case'edit-list':createList(id);break;case'add':addToPlaylist(id);break;case'choose-list':{const p=state.playlists.find(p=>p.id===list);if(p&&!p.songIds.includes(id)){p.songIds.push(id);save();render();toast('已添加到「'+p.name+'」');}else toast('这首歌已经在歌单里了');$('#modal').close();break;}case'remove-from-list':{const p=state.playlists.find(p=>p.id===location.hash.split('/')[2]);if(p){p.songIds=p.songIds.filter(s=>s!==id);save();render();toast('已从歌单移除');}break;}case'delete-list':modal('删除这张歌单？',`<p class="delete-confirm">「${esc(listBy(id)?.name)}」将从当前设备移除，里面的歌曲和收藏不受影响。建议先在设置里导出备份。</p><div class="modal-actions"><button class="secondary-button" data-action="close-modal">保留歌单</button><button class="primary-button" data-action="confirm-delete" data-id="${esc(id)}">删除歌单</button></div>`);break;case'confirm-delete':state.playlists=state.playlists.filter(p=>p.id!==id);save();$('#modal').close();location.hash='/library';render();toast('歌单已删除');break;case'save-collection':{const p=listBy(id);state.playlists.unshift({...p,id:'local-'+crypto.randomUUID(),songIds:[...p.songIds],caption:'我的歌单'});save();renderSidebar();toast('已收藏到我的歌单');break;}case'filter':activeFilter=t.dataset.filter;render();break;case'quick-search':location.hash='/search/'+encodeURIComponent(t.dataset.query);break;case'queue':drawerMode==='queue'?closeDrawer():showQueue();break;case'lyrics':showLyrics();break;case'close-drawer':closeDrawer();break;case'close-modal':$('#modal').close();break;case'settings':settings();break;case'export':exportData();break;case'import':$('#import-file').click();break;case'add-url':addUrl(id);break;case'discover':location.hash='/discover';break;case'library':location.hash='/library';break;case'back':history.length>1?history.back():location.hash='/discover';break;case'menu':$('#sidebar').classList.toggle('open');break;case'mode':state.mode={list:'repeat',repeat:'shuffle',shuffle:'list'}[state.mode];save();updatePlayer();toast($('#mode-button').title);break;case'mute':audio.muted=!audio.muted;$('#mute-button').innerHTML=icon(audio.muted?'muted':'volume');$('#mute-button').setAttribute('aria-label',audio.muted?'取消静音':'静音');break;}});
$('#search-form').onsubmit=e=>{e.preventDefault();const q=$('#global-search').value.trim();location.hash='/search/'+encodeURIComponent(q);render();};
$('#progress').addEventListener('input',e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(e.target.value)/1000*audio.duration;});
$('#volume').value=audio.volume*100;$('#volume').style.setProperty('--fill',audio.volume*100+'%');$('#volume').addEventListener('input',e=>{audio.volume=Number(e.target.value)/100;audio.muted=false;state.volume=Number(e.target.value);e.target.style.setProperty('--fill',e.target.value+'%');$('#mute-button').innerHTML=icon('volume');save();});
audio.addEventListener('timeupdate',()=>{const percent=Number.isFinite(audio.duration)&&audio.duration?audio.currentTime/audio.duration:0;$('#elapsed').textContent=format(audio.currentTime);$('#duration').textContent=format(audio.duration);$('#progress').value=Math.round(percent*1000);$('#progress').style.setProperty('--fill',percent*100+'%');});
['play','pause','loadedmetadata'].forEach(event=>audio.addEventListener(event,updatePlayer));audio.addEventListener('waiting',()=>{loading=true;updatePlayer();});audio.addEventListener('playing',()=>{loading=false;updatePlayer();});audio.addEventListener('ended',()=>next(1,true));audio.addEventListener('error',()=>{if(!current)return;loading=false;updatePlayer();});
$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw new Error('too big');importData(JSON.parse(await file.text()));}catch{toast('备份文件无效，请选择听屿导出的 JSON 文件。');}e.target.value='';};
$('#drawer-scrim').onclick=closeDrawer;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close();}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search').focus();}if(e.key==='Escape'){closeDrawer();$('#sidebar').classList.remove('open');}if(e.code==='Space'&&!['INPUT','TEXTAREA','BUTTON','SELECT','A'].includes(document.activeElement.tagName)&&!$('#modal').open){e.preventDefault();$('#play-toggle').click();}});
if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('play',()=>audio.play().catch(()=>{}));navigator.mediaSession.setActionHandler('pause',()=>audio.pause());navigator.mediaSession.setActionHandler('previoustrack',()=>next(-1));navigator.mediaSession.setActionHandler('nexttrack',()=>next());}
hydrate();render();
</script>
</body>
