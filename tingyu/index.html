<script type="module">const API_ORIGIN=document.querySelector('meta[name="api-origin"]')?.content||'https://tingyu-music-jay.xkcnjsfdny.chatgpt.site';
const pages = location.hostname === 'talentjay-ux.github.io';
const API = pages ? API_ORIGIN : '';
const directTracks = new Map();
let cataloguePromise;
let catalogueRequest = 0;
let indexLoadedAt=0;
const rejectedSources = new Set();

function mediaUrl(value) {
  try {
    const url = new URL(value);
    const known = url.hostname === 'www.gequhai.com' || url.hostname.endsWith('.kuwo.cn');
    return known && url.protocol === 'https:' && !url.username && !url.password && !url.port ? url.href : '';
  } catch { return ''; }
}

function readCatalogue(refresh=false) {
  if (refresh || (indexLoadedAt && Date.now()-indexLoadedAt > 600000)) cataloguePromise=null;
  if (!cataloguePromise) {
    const request = ++catalogueRequest;
    const path = '/tingyu-music-poc/catalog.json' + (refresh ? '?refresh='+Date.now() : '?window='+Math.floor(Date.now()/1800000));
    cataloguePromise = fetch(path, {cache:refresh?'reload':'no-cache', signal:AbortSignal.timeout(10000)})
      .then(async response => {
        if (!response.ok) throw new Error('直连曲目索引暂时无法加载');
        const catalog = await response.json();
        if (!Array.isArray(catalog.tracks)) throw new Error('曲目索引无效');
        if (request !== catalogueRequest) return cataloguePromise;
        directTracks.clear();
        indexLoadedAt=Date.now();
        for (const track of catalog.tracks) {
          if (numeric(track.id)) directTracks.set(String(track.id), {...track, audio:mediaUrl(track.audio)});
        }
        return catalog;
      }).catch(error => { if(request===catalogueRequest) cataloguePromise = null; throw error; });
  }
  return cataloguePromise;
}

const paths={music:'<path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',library:'<rect x="4" y="4" width="6" height="16" rx="1"/><path d="m14 4 6-1 2 16-6 1Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',headphones:'<path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h3v8H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2ZM20 12h-3v8h3a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2Z"/>',settings:'<path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 3 3 3-3 3 1 2-3-1-3 2-2-2-3-3-1-1-3Z"/><circle cx="12" cy="11" r="3"/>','chevron-down':'<path d="m5 9 7 7 7-7"/>','chevron-left':'<path d="m14 5-7 7 7 7"/>','chevron-right':'<path d="m9 5 7 7-7 7"/>',play:'<path d="m7 3 15 9-15 9Z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',repeat:'<path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/>',shuffle:'<path d="M3 6h3l12 12h3M3 18h3L18 6h3m-4-4 4 4-4 4m0 4 4 4-4 4"/>',previous:'<path d="M5 4v16m14-16L6 12l13 8Z"/>',next:'<path d="M19 4v16M5 4l13 8-13 8Z"/>',volume:'<path d="m11 4-6 5H2v6h3l6 5ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',queue:'<path d="M3 5h18M3 10h18M3 15h10m4-1 5 4-5 4Z"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/>',upload:'<path d="M12 15V3m-5 5 5-5 5 5M4 15v5h16v-5"/>',edit:'<path d="m15 4 5 5M4 15 16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L9 20H3Z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',check:'<path d="m5 12 4 4L20 5"/>',up:'<path d="m5 14 7-7 7 7"/>',refresh:'<path d="M20 7V2l-3 3A9 9 0 1 0 21 13M20 2h-5"/>'};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numeric=id=>/^\d{1,12}$/.test(String(id));
const safeCover=value=>{try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password?u.href:'';}catch{return '';}};
const fresh=()=>({version:2,tracks:{},liked:[],recent:[],playlists:[],queue:[],current:null,mode:'list',volume:75});
function normalizeSong(track) {
  if (!track || !numeric(track.id)) return null;
  const song = {
    id: String(track.id),
    title: String(track.title || track.name || '').slice(0,200),
    artist: String(track.artist || track.author || '').slice(0,160),
    cover: safeCover(track.cover), source:'gequhai'
  };
  const playbackUrl = mediaUrl(track.playbackUrl);
  if (playbackUrl) song.playbackUrl = playbackUrl;
  return song;
}

function normalizeIds(ids){return Array.isArray(ids)?[...new Set(ids.filter(numeric).map(String))].slice(0,1500):[];}
function readState(){let s=fresh();try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.version===2){s={...s,...v,tracks:{}};for(const t of Object.values(v.tracks||{})){const track=normalizeSong(t);if(track)s.tracks[track.id]=track;}s.liked=normalizeIds(v.liked);s.recent=normalizeIds(v.recent);s.queue=normalizeIds(v.queue);s.playlists=Array.isArray(v.playlists)?v.playlists.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string').map(p=>({id:p.id.slice(0,100),name:p.name.slice(0,60),description:String(p.description||'').slice(0,300),songIds:normalizeIds(p.songIds)})).slice(0,250):[];s.current=numeric(v.current)?String(v.current):null;s.mode=['list','repeat','shuffle'].includes(v.mode)?v.mode:'list';s.volume=Number.isFinite(Number(v.volume))?Math.min(100,Math.max(0,Number(v.volume))):75;return s;}const old=JSON.parse(localStorage.getItem('tingyu:poc:v1')||'null');if(old){s.liked=normalizeIds(old.liked);s.recent=normalizeIds(old.recent);s.playlists=(old.playlists||[]).filter(p=>p&&typeof p.name==='string').map(p=>({id:'p-'+crypto.randomUUID(),name:p.name.slice(0,60),description:String(p.description||'').slice(0,300),songIds:normalizeIds(p.songIds)}));}}catch{}return s;}
let state=readState(),saveTimer,toastTimer,storageWarned=false,routeToken=0,currentId=state.current,loading=false,playError='',lyrics=[],lyricIndex=-1,lyricsVisible=false,visibleIds=[],sheetType='',sheetSong='',contextPlaylist='';
let chartKind='hot',chartCache=new Map(),lastSearch='',searchResult={songs:[],page:0,hasMore:false},searchBusy=false;
const chartLabels={hot:'热门榜',new:'新歌榜',surge:'飙升榜',classic:'怀旧榜',douyin:'抖音榜',electronic:'电音榜'};

function save(immediate=false){clearTimeout(saveTimer);const write=()=>{saveTimer=null;try{localStorage.setItem(KEY,JSON.stringify(state));}catch{if(!storageWarned){storageWarned=true;toast('浏览器暂不允许保存，收藏仅在当前页面有效。');}}};if(immediate)write();else saveTimer=setTimeout(write,150);}
const song=id=>state.tracks[String(id)]||{id:String(id),title:'歌曲 '+id,artist:'正在读取歌曲信息',cover:'',source:'gequhai'};
function remember(list) {
  for (const track of list || []) {
    const entry = normalizeSong(track);
    if (!entry) continue;
    const previous = state.tracks[entry.id] || {};
    const candidate = [previous.playbackUrl, entry.playbackUrl, mediaUrl(track.audio), mediaUrl(track.url)]
      .find(url=>url && !rejectedSources.has(url));
    state.tracks[entry.id] = {
      ...previous, ...entry,
      title:entry.title || previous.title || '歌曲 '+entry.id,
      artist:entry.artist || previous.artist || '',
      cover:entry.cover || previous.cover || ''
    };
    if (candidate) state.tracks[entry.id].playbackUrl = candidate;
    else delete state.tracks[entry.id].playbackUrl;
  }
  save();
}

function cacheListTrack(id) {
  const indexed = directTracks.get(String(id));
  if (indexed) remember([indexed]);
}

async function liveApi(path,{signal}={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),pages ? 6500 : 42000);const abort=()=>controller.abort();signal?.addEventListener('abort',abort,{once:true});try{const r=await fetch(API+path,{signal:controller.signal,headers:{Accept:'application/json'}});let d;try{d=await r.json();}catch{throw new Error('音乐接口暂时没有响应，请重试。');}if(!r.ok||d.error)throw new Error(d.message||'歌曲海暂时无法提供数据，请重试。');return d;}catch(e){if(e.name==='AbortError')throw new Error('连接用时较长，请重试。');throw e;}finally{clearTimeout(timer);signal?.removeEventListener('abort',abort);}}
async function api(path, options) {
  if (!pages) return liveApi(path, options);
  let catalog;
  try { catalog = await readCatalogue(); } catch { return liveApi(path, options); }
  const url = new URL(path, location.origin);
  if (url.pathname === '/api/chart') {
    const ids = catalog.charts[url.searchParams.get('kind')];
    if (ids) return {songs:ids.map(id => directTracks.get(String(id))).filter(Boolean)};
  }
  if (url.pathname === '/api/search') {
    const term = url.searchParams.get('q').trim().toLocaleLowerCase();
    const rows = [...directTracks.values()].filter(song =>
      (song.title + ' ' + song.artist).toLocaleLowerCase().includes(term));
    const page = Number(url.searchParams.get('page')) || 1;
    if (rows.length) return {songs:rows.slice((page-1)*15,page*15),hasMore:page*15<rows.length,indexed:true};
    try { return await liveApi(path, options); }
    catch { return {songs:[],hasMore:false,indexed:true}; }
  }
  const id = url.pathname.match(/^\/api\/play\/(\d+)$/)?.[1];
  if (id && directTracks.has(id)) return directTracks.get(id);
  return liveApi(path, options);
}

let playback = null;

function playbackFailed(run, message) {
  if (playback !== run) return;
  loading = false;
  playError = message;
  updatePlayer();
  toast(message);
}

function forgetFailedSource(run, src) {
  if (!mediaUrl(src)) return;
  rejectedSources.add(src);
  const track = state.tracks[run.id];
  if (track?.playbackUrl === src) { delete track.playbackUrl; save(true); }
}

function stopStartupTimer(run) {
  if (!run) return;
  clearTimeout(run.startupTimer);
  run.startupTimer = null;
}

function playSelectedSource(run, src) {
  if (playback !== run) return;
  const same = audio.getAttribute('src') === src && !audio.error;
  run.src = src;
  run.attempted.add(src);
  run.resolving = false;
  run.needsTap = false;
  playError = '';
  loading = true;
  if (!same) {
    audio.src = src;
    audio.load();
  } else {
    try { audio.currentTime = 0; } catch {}
  }
  // Keep the first play() inside the tap for a saved URL on mobile Safari.
  stopStartupTimer(run);
  const generation = ++run.generation;
  const result = audio.play();
  run.startupTimer = setTimeout(() => {
    if (playback !== run || generation !== run.generation || run.needsTap) return;
    if (audio.readyState >= 3 && !audio.paused) return;
    run.generation++;
    audio.pause();
    forgetFailedSource(run, src);
    resolvePlayback(run);
  }, 12000);
  updatePlayer();
  result.then(() => {
    if (playback !== run || run.src !== src || generation!==run.generation) return;
    stopStartupTimer(run);
    const track = state.tracks[run.id];
    if (track && mediaUrl(src)) track.playbackUrl = src;
    state.recent = [run.id, ...state.recent.filter(id => id !== run.id)].slice(0,100);
    loading = false;
    playError = '';
    save(true);
    updatePlayer();
    mediaMetadata();
  }).catch(error => {
    if (playback !== run || run.src !== src || generation!==run.generation || error.name === 'AbortError') return;
    stopStartupTimer(run);
    if (error.name === 'NotAllowedError') {
      run.needsTap = true;
      playbackFailed(run, '请点播放继续。');
    } else {
      forgetFailedSource(run, src);
      resolvePlayback(run);
    }
  });
}

async function resolvePlayback(run) {
  if (!run || playback !== run || run.resolving) return;
  run.resolving = true;
  const startCandidate = value => {
    const url = mediaUrl(value);
    if (playback !== run || !url || run.attempted.has(url) || rejectedSources.has(url)) return false;
    playSelectedSource(run, url);
    return true;
  };
  if (startCandidate(directTracks.get(run.id)?.audio) ||
      startCandidate(state.tracks[run.id]?.playbackUrl)) return;
  if (pages && !run.checkedIndex) {
    run.checkedIndex = true;
    try { await readCatalogue(run.attempted.size > 0 || rejectedSources.size > 0); } catch {}
    if (playback !== run) return;
    const track = directTracks.get(run.id);
    if (track) {
      remember([track]);
      if (startCandidate(track.audio)) return;
    }
  }
  if (!run.checkedLive) {
    run.checkedLive = true;
    try {
      const detail = await liveApi('/api/play/'+run.id);
      if (playback !== run) return;
      remember([detail]);
      lyrics = parseLyrics(detail.lyrics);
      drawLyrics();
      if (startCandidate(detail.url)) return;
    } catch {}
  }
  if (playback !== run) return;
  const stream = API+'/api/audio/'+run.id;
  if (!run.attempted.has(stream)) {
    playSelectedSource(run, stream);
    return;
  }
  run.resolving = false;
  stopStartupTimer(run);
  playbackFailed(run, '歌曲海的播放地址暂时不可用。点此重新获取。');
}

function playTrack(id, ids=null) {
  if (!numeric(id)) return;
  id = String(id);
  if (ids) state.queue = normalizeIds(ids);
  if (!state.queue.includes(id)) state.queue.push(id);
  const sameSource = !playError && !playback?.resolving && currentId === id && audio.getAttribute('src') && !audio.error;
  stopStartupTimer(playback);
  const run = {id, src:'', generation:0, startupTimer:null, attempted:new Set(), checkedIndex:false, checkedLive:false, resolving:false, needsTap:false};
  playback = run;
  currentId = state.current = id;
  audio.pause();
  if (!sameSource) {
    audio.removeAttribute('src');
    audio.load();
  }
  playError = '';
  loading = true;
  lyrics = [];
  drawLyrics();
  $('#seek').value = 0;
  $('#seek').style.setProperty('--fill','0%');
  $('#mini-progress-fill').style.width = '0%';
  $('#elapsed').textContent = '00:00';
  $('#duration').textContent = '00:00';
  save();
  updatePlayer();
  if (sameSource && !rejectedSources.has(audio.getAttribute('src'))) playSelectedSource(run, audio.getAttribute('src'));
  else resolvePlayback(run);
}

function togglePlayback() {
  if (!currentId) {
    const id = visibleIds[0] || state.queue[0];
    if (id) playTrack(id, visibleIds.length ? visibleIds : state.queue);
    else toast('先搜索一首喜欢的歌吧');
    return;
  }
  if (playback?.needsTap && audio.getAttribute('src')) {
    playSelectedSource(playback, playback.src);
  } else if (playError || !audio.getAttribute('src')) {
    playTrack(currentId);
  } else if (audio.paused) {
    const run = playback;
    audio.play().catch(error => {
      if (playback !== run || error.name === 'AbortError') return;
      if (error.name === 'NotAllowedError') {
        if (run) run.needsTap = true;
        playbackFailed(run, '请点播放继续。');
      } else resolvePlayback(run);
    });
  } else {
    stopStartupTimer(playback);
    audio.pause();
  }
}
function next(direction=1,ended=false){const ids=state.queue;if(!ids.length)return;let i=ids.indexOf(currentId);if(direction===-1&&audio.currentTime>3){audio.currentTime=0;return;}if(ended&&state.mode==='repeat'){audio.currentTime=0;audio.play().catch(()=>{});return;}if(state.mode==='shuffle'&&ids.length>1){let j;do{j=Math.floor(Math.random()*ids.length);}while(j===i);i=j;}else{const j=i+direction;if(ended&&j>=ids.length){loading=false;updatePlayer();return;}i=(j+ids.length)%ids.length;}playTrack(ids[i]);}

function showSheet(type,title,body){sheetType=type;$('#sheet-content').innerHTML=`<div class="sheet-heading"><h2>${title}</h2><button class="round-button" data-action="close-sheet" aria-label="关闭弹窗">${icon('close')}</button></div>${body}`;if(!$('#sheet').open)$('#sheet').showModal();}
function closeSheet(){$('#sheet').close();sheetType='';}
function songMenu(id,playlist=''){const s=song(id);sheetSong=id;showSheet('song','',`<div class="sheet-track-title">${cover(s)}<span class="track-meta"><strong>${esc(s.title)}</strong><small>${esc(s.artist||'歌曲海')}</small></span></div><div class="sheet-actions"><button class="sheet-action" data-action="like" data-id="${id}">${icon('heart')} ${state.liked.includes(id)?'取消喜欢':'加入我喜欢的音乐'}</button><button class="sheet-action" data-action="add-to-list" data-id="${id}">${icon('plus')}加入歌单</button><button class="sheet-action" data-action="play-next" data-id="${id}">${icon('next')}下一首播放</button><button class="sheet-action" data-action="enqueue" data-id="${id}">${icon('queue')}加入播放队列</button>${playlist?`<button class="sheet-action" data-action="move-song" data-id="${id}" data-list="${esc(playlist)}" data-direction="-1">${icon('up')}在歌单中上移</button><button class="sheet-action danger" data-action="remove-from-list" data-id="${id}" data-list="${esc(playlist)}">${icon('trash')}从这张歌单移除</button>`:''}</div>`);}
function addToList(id){const s=song(id);showSheet('choose-list','加入歌单',`<p class="sheet-subtitle">${esc(s.title)} · ${esc(s.artist)}</p><button class="sheet-action" data-action="new-list-with-song" data-id="${id}">${icon('plus')}创建新歌单</button>${state.playlists.length?state.playlists.map(p=>`<button class="collection-line" data-action="choose-list" data-id="${id}" data-list="${esc(p.id)}">${cover(p.songIds.map(song).find(s=>s.cover))}<span><strong>${esc(p.name)}</strong><small>${p.songIds.length} 首音乐</small></span></button>`).join(''):'<p class="sheet-note">还没有歌单？从这首喜欢的歌开始创建一张。</p>'}`);}
function editList(id=null,addId=null){const p=state.playlists.find(p=>p.id===id);showSheet('edit-list',p?'编辑歌单':'创建一张新歌单',`<p class="sheet-subtitle">把喜欢的旋律放在一起。歌单保存在这台设备，无需登录。</p><form id="list-form"><label class="form-field"><span>歌单名称</span><input name="name" aria-label="歌单名称" maxlength="60" required placeholder="例如：下班后的自由时间" value="${esc(p?.name||'')}"></label><label class="form-field"><span>想对这张歌单说的话</span><textarea name="description" aria-label="歌单描述" rows="3" maxlength="300" placeholder="留下一点属于这张歌单的心情……">${esc(p?.description||'')}</textarea></label>${p?`<button type="button" class="sheet-action danger" data-action="delete-list" data-id="${esc(p.id)}">${icon('trash')}删除歌单</button>`:''}<div class="form-actions"><button type="button" class="secondary-button" data-action="close-sheet">取消</button><button class="primary-button" type="submit">${p?'保存修改':'创建歌单'}</button></div></form>`);$('#list-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name){toast('给这张歌单起个名字吧');return;}let target;if(p){p.name=name;p.description=f.get('description').trim();target=p.id;}else{target='p-'+crypto.randomUUID();if(addId)cacheListTrack(addId);state.playlists.unshift({id:target,name,description:f.get('description').trim(),songIds:addId?[addId]:[]});}save(true);closeSheet();location.hash='/playlist/'+encodeURIComponent(target);render();toast(p?'歌单已更新':'歌单创建成功');};}
function showQueue(){showSheet('queue',`播放队列 <span class="inline-count">${state.queue.length} 首</span>`,state.queue.length?`<div class="queue-list">${trackRows(state.queue,{queue:true})}</div>`:empty('队列还是空的','在歌曲旁的更多操作里，可以加入播放队列。','search','去找音乐'));}
function showPlayer(){if(!currentId){toast('先选择一首音乐吧');return;}updatePlayer();if(!$('#player-screen').open)$('#player-screen').showModal();}
function settings(){showSheet('settings','音乐留在这里',`<p class="sheet-subtitle">所有音乐来自歌曲海。收藏、歌单和播放记录保存在当前浏览器，不需要注册。清除浏览器数据前，可以先导出备份。</p><div class="sheet-actions"><button class="sheet-action" data-action="export">${icon('download')}导出歌单与收藏</button><button class="sheet-action" data-action="import">${icon('upload')}导入备份</button></div><p class="sheet-note">音乐由歌曲海实时提供。歌单只存在这台设备，不会自动同步到其他设备。</p>`);}
function exportData(){const file=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='tingyu-music-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出');}
function importData(v){if(!v||![1,2].includes(v.version)||!Array.isArray(v.playlists)||!Array.isArray(v.liked))throw new Error('无效的备份文件');if(v.playlists.length>250)throw new Error('歌单数量过多');const tracks=Object.values(v.tracks||{}).map(normalizeSong).filter(Boolean);if(tracks.length>5000)throw new Error('歌曲数量过多');remember(tracks);const lists=v.playlists.filter(p=>p&&typeof p.name==='string'&&Array.isArray(p.songIds)).map(p=>({id:'p-'+crypto.randomUUID(),name:p.name.slice(0,60),description:String(p.description||'').slice(0,300),songIds:normalizeIds(p.songIds)}));state.playlists.push(...lists);state.liked=normalizeIds([...state.liked,...v.liked]);save(true);closeSheet();render();toast(`已导入 ${lists.length} 张歌单，保留了原有收藏`);}
function enqueue(id,nextSong=false){state.queue=state.queue.filter(x=>x!==id);if(nextSong&&currentId){const i=state.queue.indexOf(currentId);state.queue.splice(i<0?0:i+1,0,id);}else state.queue.push(id);save();closeSheet();toast(nextSong?'已设为下一首播放':'已加入播放队列');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const {action,id,list}=el.dataset;switch(action){case'chart':chartKind=el.dataset.kind;render();break;case'retry-view':chartCache.delete(chartKind);render();break;case'play':playTrack(id,visibleIds);break;case'play-queue':playTrack(id);showQueue();break;case'play-all':if(visibleIds.length)playTrack(visibleIds[0],visibleIds);else toast('先加载一份歌曲列表，再开始播放。');break;case'toggle':togglePlayback();break;case'next':next();break;case'previous':next(-1);break;case'now-playing':showPlayer();break;case'close-player':$('#player-screen').close();break;case'queue':showQueue();break;case'close-sheet':closeSheet();break;case'song-menu':songMenu(id,el.dataset.playlist);break;case'current-menu':if(currentId)songMenu(currentId);break;case'like':like(id);closeSheet();break;case'like-current':if(currentId)like(currentId);break;case'add-current':if(currentId)addToList(currentId);break;case'add-to-list':addToList(id);break;case'create-list':editList();break;case'new-list-with-song':editList(null,id);break;case'edit-list':editList(id);break;case'choose-list':{const p=state.playlists.find(p=>p.id===list);if(p){if(p.songIds.includes(id))toast('这首歌已经在歌单里了');else{cacheListTrack(id);p.songIds.push(id);save(true);toast('已加入「'+p.name+'」');if(currentRoute().name==='playlist')render();}closeSheet();}break;}case'remove-from-list':{const p=state.playlists.find(p=>p.id===list);if(p){p.songIds=p.songIds.filter(x=>x!==id);save(true);closeSheet();render();toast('已从歌单移除');}break;}case'move-song':{const p=state.playlists.find(p=>p.id===list);if(p){const i=p.songIds.indexOf(id);if(i>0){[p.songIds[i-1],p.songIds[i]]=[p.songIds[i],p.songIds[i-1]];save(true);closeSheet();render();toast('已上移一首');}else toast('已经是歌单的第一首');}break;}case'delete-list':{const p=state.playlists.find(p=>p.id===id);showSheet('delete-list','删除这张歌单？',`<p class="sheet-subtitle">「${esc(p?.name)}」将从当前设备移除。歌曲收藏和其他歌单不受影响。</p><div class="form-actions"><button class="secondary-button" data-action="close-sheet">保留歌单</button><button class="primary-button" data-action="confirm-delete" data-id="${esc(id)}">删除歌单</button></div>`);break;}case'confirm-delete':state.playlists=state.playlists.filter(p=>p.id!==id);save(true);closeSheet();location.hash='/library';render();toast('歌单已删除');break;case'play-next':enqueue(id,true);break;case'enqueue':enqueue(id);break;case'remove-queue':state.queue=state.queue.filter(x=>x!==id);save();showQueue();break;case'mode':state.mode={list:'repeat',repeat:'shuffle',shuffle:'list'}[state.mode];save();updatePlayer();toast({list:'顺序播放',repeat:'单曲循环',shuffle:'随机播放'}[state.mode]);break;case'lyrics':if(currentId&&!lyrics.length&&pages){const id=currentId;liveApi('/api/play/'+id).then(track=>{if(currentId===id){lyrics=parseLyrics(track.lyrics);drawLyrics();updateLyric();}}).catch(()=>{if(currentId===id)toast('当前网络未能加载歌词');});}lyricsVisible=!lyricsVisible;$('#player-art').hidden=lyricsVisible;$('#lyrics-pane').hidden=!lyricsVisible;$('#lyrics-button').classList.toggle('active',lyricsVisible);$('#lyrics-button').textContent=lyricsVisible?'封面':'歌词';updateLyric();break;case'settings':settings();break;case'export':exportData();break;case'import':$('#backup-file').click();break;case'search':closeSheet();$('#player-screen').close();location.hash='/search';break;case'library':location.hash='/library';break;case'focus-search':$('#search-input')?.focus();break;case'search-for':location.hash='/search/'+encodeURIComponent(el.dataset.query);break;case'retry-search':runSearch(lastSearch,1);break;case'more-search':runSearch(lastSearch,searchResult.page+1);break;}});
$('#player-error').onclick=()=>playback?.needsTap ? togglePlayback() : currentId && playTrack(currentId);
$('#seek').addEventListener('input',e=>{if(Number.isFinite(audio.duration)&&audio.duration>0){audio.currentTime=Number(e.target.value)/1000*audio.duration;$('#elapsed').textContent=durationText(audio.currentTime);}});
audio.volume=state.volume/100;$('#volume').value=state.volume;$('#volume').style.setProperty('--fill',state.volume+'%');$('#volume').addEventListener('input',e=>{state.volume=Number(e.target.value);audio.volume=state.volume/100;e.target.style.setProperty('--fill',state.volume+'%');save();});
audio.addEventListener('timeupdate',()=>{const percentage=Number.isFinite(audio.duration)&&audio.duration>0?audio.currentTime/audio.duration:0;$('#seek').value=Math.round(percentage*1000);$('#seek').style.setProperty('--fill',percentage*100+'%');$('#mini-progress-fill').style.width=percentage*100+'%';$('#elapsed').textContent=durationText(audio.currentTime);$('#duration').textContent=durationText(audio.duration);updateLyric();if('mediaSession'in navigator&&navigator.mediaSession.setPositionState&&Number.isFinite(audio.duration)&&audio.duration>0){try{navigator.mediaSession.setPositionState({duration:audio.duration,position:Math.min(audio.currentTime,audio.duration),playbackRate:audio.playbackRate});}catch{}}});
audio.addEventListener('waiting',()=>{loading=true;updatePlayer();});audio.addEventListener('playing',()=>{loading=false;playError='';updatePlayer();});['pause','play','loadedmetadata'].forEach(name=>audio.addEventListener(name,updatePlayer));audio.addEventListener('ended',()=>next(1,true));audio.addEventListener('error', () => {
  const run = playback;
  if (run && audio.error && audio.error.code!==1 && !run.needsTap && run.src === audio.getAttribute('src')) {
    stopStartupTimer(run);
    forgetFailedSource(run, run.src);
    resolvePlayback(run);
  }
});
$('#backup-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw new Error('too large');importData(JSON.parse(await f.text()));}catch{toast('请使用听屿导出的 JSON 备份文件。');}e.target.value='';};
$('#sheet').addEventListener('click',e=>{if(e.target!==$('#sheet'))return;const r=$('#sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet();});
window.addEventListener('hashchange',()=>{searchBusy=false;render();window.scrollTo(0,0);});window.addEventListener('pagehide',()=>{if(saveTimer)save(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden && saveTimer) save(true);});
window.addEventListener('storage', event => {
  if (event.key !== KEY || !event.newValue) return;
  const incoming = readState();
  state.liked = incoming.liked;
  state.playlists = incoming.playlists;
  state.tracks = {...state.tracks, ...incoming.tracks};
  const route = currentRoute().name;
  if (['library','liked','playlist'].includes(route)) render();
  else updatePlayer();
});
if('mediaSession'in navigator){const actions={play:()=>{if(audio.paused)togglePlayback();},pause:()=>audio.pause(),nexttrack:()=>next(),previoustrack:()=>next(-1),seekto:d=>{if(Number.isFinite(d.seekTime))audio.currentTime=d.seekTime;},seekbackward:d=>{audio.currentTime=Math.max(0,audio.currentTime-(d.seekOffset||10));},seekforward:d=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+(d.seekOffset||10));}};for(const[k,v]of Object.entries(actions)){try{navigator.mediaSession.setActionHandler(k,v);}catch{}}}
if(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))$('.volume-row').hidden=true;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
render();
</script>
</body>
</html>
